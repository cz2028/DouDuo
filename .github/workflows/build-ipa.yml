name: Build DouDuo unsigned IPA

# 放到 fork 仓库的 .github/workflows/build-ipa.yml
# 触发后约 10-20 分钟出包（VLCKit 下载约 1GB 占大头）

on:
  workflow_dispatch:          # 手动点 Run workflow
  push:
    branches: [main]          # 或只在手动触发时构建，去掉这段

permissions:
  contents: write             # 发布 Release 需要写权限

jobs:
  build:
    runs-on: xcode-27         # GitHub 官方标签；自带 Xcode 27.2 / iOS 27.2 SDK（项目要求）
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: 选 Xcode 27.2
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app/Contents/Developer
          xcodebuild -version

      - name: 下载 VLCKit 二进制（约 1GB）
        run: |
          chmod +x scripts/fetch-vlckit.sh
          ./scripts/fetch-vlckit.sh

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 编译真机包（不签名）
        run: |
          xcodebuild -project DouDuo.xcodeproj -scheme DouDuo -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/dd \
            build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: 打包 unsigned IPA
        run: |
          APP=build/dd/Build/Products/Release-iphoneos/DouDuo.app
          test -d "$APP" || { echo "编译产物不存在"; exit 1; }
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -qry ../DouDuo-unsigned.ipa Payload)
          ls -lh build/DouDuo-unsigned.ipa

      - name: 上传 IPA 制品
        uses: actions/upload-artifact@v4
        with:
          name: DouDuo-unsigned-ipa
          path: build/DouDuo-unsigned.ipa
          retention-days: 30

      # 制品链接 30 天过期且需要登录；Release 资源是永久公开直链
      - name: 发布 Release（永久下载链接）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER=$(grep -m1 MARKETING_VERSION project.yml | awk '{print $2}')
          BLD=$(grep -m1 CURRENT_PROJECT_VERSION project.yml | tr -d '"' | awk '{print $2}')
          TAG="v${VER}-b${BLD}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          gh release view "$TAG" >/dev/null 2>&1 && gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" build/DouDuo-unsigned.ipa \
            --title "DouDuo v${VER} (build ${BLD}) 未签名 IPA" \
            --notes "未签名 IPA，需自行签名安装。
主要的性能/内存修复见仓库提交记录。"
          echo "DOWNLOAD=https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/DouDuo-unsigned.ipa" >> "$GITHUB_ENV"

      - name: 输出永久下载地址
        run: echo "🔗 $DOWNLOAD"
